<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8eff0">
<title>逸醉菁年</title>
<style>
:root{
 --pink:#DEB7B8; --pink2:#F2D5D7; --cream:#FFF9F7; --paper:#FFFEFC;
 --ink:#4f4852; --muted:#8d7d84; --blue:#787785; --line:rgba(183,132,142,.20);
 --shadow:0 16px 42px rgba(96,67,75,.13); --safe:env(safe-area-inset-bottom,0px);
 --shell:min(100vw,430px); --boy-travel:calc(-1 * (min(100vw,430px) - 150px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#e9e3e7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit;color:inherit} button{cursor:pointer} img{display:block;max-width:100%}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100svh;background:linear-gradient(180deg,#fffaf9 0%,#fbf1f2 58%,#f7edef 100%);position:relative;overflow-x:hidden;box-shadow:0 0 80px rgba(57,42,48,.14)}
.noise{position:fixed;left:50%;transform:translateX(-50%);top:0;bottom:0;width:min(100vw,430px);pointer-events:none;z-index:200;opacity:.13;background-image:radial-gradient(rgba(120,91,98,.28) .55px,transparent .65px);background-size:13px 13px}
.hide{display:none!important}

/* lock */
.lock{min-height:100svh;display:grid;place-items:center;padding:24px 18px calc(24px + var(--safe));position:relative;overflow:hidden;background:radial-gradient(circle at 78% 14%,rgba(255,255,255,.68) 0 9%,transparent 9.5%),linear-gradient(145deg,#f7e6e8 0%,#e7c9ce 52%,#d8d9e5 100%)}
.lock:before{content:"";position:absolute;inset:-10%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.17) 0 1px,transparent 1px 42px),repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 1px,transparent 1px 42px);transform:rotate(-4deg)}
.lock-shell{width:100%;max-width:394px;position:relative;z-index:2}
.lock-book{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,250,249,.84));border:1px solid rgba(255,255,255,.92);border-radius:36px;padding:22px;box-shadow:0 30px 90px rgba(74,50,58,.24);backdrop-filter:blur(18px)}
.lock-book:before{content:"";position:absolute;inset:11px;border:1px dashed rgba(183,132,142,.42);border-radius:27px;pointer-events:none}
.lock-photo{height:218px;border-radius:26px;overflow:hidden;position:relative;background:#f7dcdf}
.lock-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.88) brightness(1.04)}
.lock-photo:after{content:"PRIVATE LOVE ARCHIVE";position:absolute;left:18px;bottom:16px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.82);font-size:9px;letter-spacing:.18em;color:#836e75;backdrop-filter:blur(8px)}
.lock-copy{padding:23px 10px 8px;text-align:center}
.lock-copy h1{margin:0;font-family:Georgia,"Songti SC",serif;font-size:34px;font-weight:500;letter-spacing:.18em}
.lock-copy p{margin:8px 0 20px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.passrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.passrow input{min-width:0;height:49px;border:1px solid rgba(183,132,142,.26);border-radius:17px;padding:0 16px;background:rgba(255,255,255,.92);outline:none;box-shadow:inset 0 1px 0 white}
.passrow input:focus{border-color:#c497a0;box-shadow:0 0 0 4px rgba(222,183,184,.18)}
.passrow button{height:49px;border:0;border-radius:17px;padding:0 19px;background:linear-gradient(145deg,#8d8798,#6f7082);color:white;box-shadow:0 10px 24px rgba(120,119,133,.25);font-size:13px;letter-spacing:.08em}
.lock-error{height:18px;margin-top:7px;font-size:11px;color:#ad6875}
.lock-doll{position:absolute;z-index:3;width:104px;bottom:-9px;filter:drop-shadow(0 14px 18px rgba(74,47,57,.18));animation:lockFloat 3.6s ease-in-out infinite;pointer-events:none}
.lock-doll.g{left:-20px}.lock-doll.b{right:-22px;animation-delay:-1.6s}
@keyframes lockFloat{50%{transform:translateY(-9px) rotate(1.5deg)}}

/* common */
.home{padding-bottom:calc(154px + var(--safe))}.top{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;background:rgba(255,250,249,.78);backdrop-filter:blur(17px);border-bottom:1px solid rgba(183,132,142,.14)}
.brand{font-family:"Songti SC",Georgia,serif;letter-spacing:.12em;font-size:16px}.music{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(80,55,62,.07)}
.section{padding:18px 14px}.section-title{font-family:"Songti SC",Georgia,serif;font-size:25px;font-weight:500;margin:0 0 12px}.micro{font-size:9px;letter-spacing:.18em;color:#a18189;text-transform:uppercase}

/* calendar */
.calendar{margin:0 14px 12px;padding:19px 15px 15px;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.90);box-shadow:var(--shadow);position:relative;overflow:hidden}.calendar:before{content:"";position:absolute;width:92px;height:92px;right:-36px;top:-38px;border:1px dashed rgba(222,183,184,.45);border-radius:50%}.calendar:after{content:"♡  ✦";position:absolute;right:15px;top:12px;color:#d3a0aa;font:12px Georgia,serif;letter-spacing:.35em;opacity:.7;pointer-events:none}
.cal-top{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:4px;margin-bottom:11px}.cal-nav{width:36px;height:36px;border:0;border-radius:50%;background:#faf1f2;font-size:22px;color:#9c737c}.cal-heading{text-align:center}.cal-heading strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:22px;font-weight:500}.cal-heading span{display:block;font-size:9px;color:#9b878d;letter-spacing:.16em;margin-top:2px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{font-size:9px;color:#a08e94;text-align:center;margin-bottom:5px}.day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font-family:Georgia,serif;font-size:12px;position:relative}.day.muted{opacity:.18}.day.today{background:var(--blue);color:#fff;box-shadow:0 7px 14px rgba(120,119,133,.24)}.day.start{box-shadow:inset 0 0 0 1px rgba(183,132,142,.55);color:#9f6470}.day.start:before{content:"♥";position:absolute;right:3px;top:1px;color:#ca788b;font-size:7px}.day.has-note:after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#c98694;box-shadow:0 0 0 2px rgba(255,255,255,.72)}.day:active{transform:scale(.92)}
.love-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.stat{background:#fbf0f2;border:1px solid rgba(183,132,142,.12);border-radius:17px;padding:11px 12px}.stat small{display:block;color:#a18d93;font-size:9px}.stat strong{display:block;margin-top:3px;font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:16px;color:#765b63}.counter{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px}.counter div{text-align:center}.counter b{font-family:Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums}.counter span{display:block;font-size:8px;color:#9f8c92;margin-top:2px}

/* hero art */
.hero-art{margin:18px 14px 4px;position:relative;height:395px}.hero-blob{position:absolute;inset:34px 0 18px 28px;border-radius:44% 56% 50% 50%/47% 43% 57% 53%;background:linear-gradient(145deg,#edd5d9,#dcdbe7)}
.scrap{position:absolute;left:3px;top:0;width:82%;padding:7px;background:white;border-radius:14px;box-shadow:0 22px 46px rgba(82,57,65,.18);transform:rotate(-3.5deg)}.scrap img{border-radius:9px;width:100%}
.polaroid{position:absolute;right:0;bottom:20px;width:49%;background:#fff;padding:7px 7px 28px;border-radius:8px;box-shadow:0 18px 35px rgba(82,57,65,.22);transform:rotate(6deg)}.polaroid img{border-radius:4px;aspect-ratio:1/1;object-fit:cover}.polaroid:after{content:"1000+";position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:cursive;font-size:12px;color:#8e777e}
.cuddle{position:absolute;left:-10px;bottom:2px;width:53%;filter:drop-shadow(0 13px 16px rgba(82,57,65,.15));animation:cuddleX 4.8s ease-in-out infinite;will-change:transform}@keyframes cuddleX{0%,100%{transform:translateX(-7px) rotate(-5deg)}50%{transform:translateX(24px) rotate(-2deg)}}

/* menu */
.menu{padding:8px 14px 18px}.menu-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.menu-head h2{font-family:"Songti SC",serif;font-weight:500;font-size:25px;margin:0}.menu-head span{font-size:9px;letter-spacing:.17em;color:#a18a91}
.entry{width:100%;min-height:128px;border:1px solid var(--line);border-radius:23px;margin-bottom:10px;background:rgba(255,255,255,.84);box-shadow:0 10px 28px rgba(88,62,69,.08);padding:17px;text-align:left;display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;overflow:hidden;position:relative}.entry-copy b{font-family:"Songti SC",serif;font-size:23px;font-weight:500}.entry-copy small{display:block;margin-top:7px;color:#9d878e;font-size:10px;line-height:1.6}.entry img{width:112px;height:92px;object-fit:cover;border-radius:16px;transform:rotate(2deg)}.entry:nth-child(2n) img{transform:rotate(-2deg)}.entry:active{transform:scale(.985)}
.entry.notes{background:linear-gradient(145deg,#fffefc,#fbf3e9)}.entry.diary{background:linear-gradient(145deg,#fff,#f8e9ec)}.entry.forum{background:linear-gradient(145deg,#fff,#eaebf2)}.entry.moments{background:linear-gradient(145deg,#fff,#edf3ef)}
.footer{text-align:center;color:#a18e94;font-size:9px;letter-spacing:.14em;padding:12px 0 10px}

/* page */
.page{position:fixed;left:50%;transform:translateX(calc(-50% + 22px));top:0;bottom:0;width:min(100vw,430px);z-index:70;background:#fbf4f5;overflow-y:auto;opacity:0;visibility:hidden;pointer-events:none;transition:transform .34s cubic-bezier(.2,.75,.2,1),opacity .22s ease,visibility 0s linear .34s;padding-bottom:calc(24px + var(--safe));overscroll-behavior:contain;overscroll-behavior-x:none}.page.open{transform:translateX(-50%);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.pagebar{height:58px;padding:0 13px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;position:sticky;top:0;z-index:5;background:rgba(255,250,249,.84);backdrop-filter:blur(17px);border-bottom:1px solid rgba(183,132,142,.14)}.back{width:38px;height:38px;border:0;background:transparent;font-size:28px;line-height:1}.pagebar h1{text-align:center;font-size:15px;font-weight:600;margin:0}.pagebody{padding:18px 14px}

/* diary list */
.diary-cover{height:180px;border-radius:27px;overflow:hidden;position:relative;box-shadow:var(--shadow);margin-bottom:18px}.diary-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) brightness(1.06)}.diary-cover:after{content:"DIARY";position:absolute;left:17px;bottom:15px;color:#fff;font:500 31px Georgia,serif;letter-spacing:.12em;text-shadow:0 2px 16px rgba(70,50,58,.35)}
.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:6px;top:9px;bottom:20px;width:1px;background:#d8b9bf}.diary-item{position:relative;width:100%;border:0;background:#fff;border-radius:20px;padding:16px 16px 15px;margin-bottom:12px;text-align:left;box-shadow:0 9px 25px rgba(85,59,66,.07)}.diary-item:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;left:-20px;top:23px;background:#c68d98;box-shadow:0 0 0 5px #fbf4f5}.diary-date{font:12px Georgia,serif;letter-spacing:.09em;color:#9e6f79}.diary-label{font-family:"Songti SC",serif;font-size:20px;margin-top:6px}.diary-preview{font-size:11px;color:#9b878d;line-height:1.65;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* diary article */
.paper{position:relative;margin:2px 0 18px;background:#fffdf8;border:1px solid rgba(170,135,116,.19);border-radius:6px;padding:29px 22px 54px;box-shadow:0 13px 34px rgba(91,68,58,.10);background-image:repeating-linear-gradient(transparent 0 31px,rgba(170,135,116,.085) 31px 32px)}.paper.old{background-color:#fffaf0}.article-date{font:13px Georgia,serif;color:#a16b76;letter-spacing:.1em}.article-label{font-family:"Songti SC",serif;font-size:27px;font-weight:500;margin:9px 0 22px}.article-text p{font-family:"Songti SC",serif;font-size:15px;line-height:2.05;margin:0 0 10px;color:#5a5055}.article-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px}.article-nav button{height:46px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:12px}.fold{position:absolute;right:0;bottom:0;width:44px;height:44px;border:0;background:linear-gradient(135deg,transparent 49%,#d7b3ab 50% 52%,#f2dfd8 53%);border-radius:0 0 5px 0;padding:0}

/* notes */
.notes-app{min-height:calc(100svh - 58px);background:#fffdf8}.notes-toolbar{padding:18px 18px 4px;color:#c99625;font-size:13px}.notes-title{font-size:31px;font-weight:700;letter-spacing:-.04em;margin:11px 18px 18px;color:#272329}.note{padding:0 18px 24px}.note-no{font-weight:650;font-size:15px;margin-bottom:8px}.note p{font-size:15px;line-height:1.72;margin:0 0 7px;color:#29262b}.note-divider{height:1px;background:#ece7df;margin:2px 18px 22px}.notes-bottom{position:sticky;bottom:0;height:48px;background:rgba(255,253,248,.91);backdrop-filter:blur(15px);border-top:1px solid #ebe7df;display:flex;justify-content:space-around;align-items:center;color:#c99625;font-size:19px}

/* forum */
.forum-shell{background:#f1f2f5;min-height:calc(100svh - 58px);padding:11px}.thread-card,.floor{background:#fff;border-radius:17px;padding:15px;margin-bottom:9px}.thread-title{font-size:17px;font-weight:650;line-height:1.55;margin:8px 0 15px}.userline{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.userline b{font-size:12px}.userline span{font-size:9px;color:#999}.skeleton{height:10px;border-radius:999px;background:#ececf0;margin:9px 0}.skeleton.short{width:62%}.floor-head{display:flex;justify-content:space-between;font-size:10px;color:#999}.reply-box{margin-top:9px;padding:9px 10px;border-left:3px solid #d9b1ba;background:#faf1f3;border-radius:8px}.reply-box .skeleton{background:#eadfe2}

/* moments */
.moments-shell{background:#fff;min-height:calc(100svh - 58px)}
.moments-intro{height:46px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;font-size:16px;font-weight:600;background:#fafafa;position:sticky;top:58px;z-index:2}
.moments-cover{height:238px;position:relative;background:#d9d3d5;margin-bottom:43px;overflow:visible}.moments-cover>img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 40%}.moments-cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.04) 58%,rgba(0,0,0,.16));pointer-events:none}.moments-owner{position:absolute;right:16px;bottom:-34px;display:flex;align-items:flex-end;gap:11px;z-index:2}.moments-owner span{color:#fff;font-size:16px;font-weight:650;text-shadow:0 1px 7px rgba(0,0,0,.48);padding-bottom:39px}.moments-owner img{width:70px;height:70px;border-radius:7px;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.moment-list{padding:2px 16px 28px}.moment{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:17px 0;border-bottom:1px solid #ededed}.moment-avatar{width:42px;height:42px;border-radius:6px;overflow:hidden}.moment-avatar img{width:100%;height:100%;object-fit:cover}.moment-body{min-width:0}.moment-name{font-size:14px;font-weight:600;color:#576b95;margin-bottom:5px}.moment-copy{font-size:14px;line-height:1.55;color:#171717;white-space:pre-wrap}.moment-media{margin-top:8px;max-width:278px}.moment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}.moment-grid img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.moment-single{width:min(232px,74vw);max-height:315px;object-fit:cover;border-radius:2px;background:#eee}.moment-single.wide{width:min(278px,78vw);aspect-ratio:16/10;object-fit:cover}.video-card{position:relative;width:min(278px,78vw);overflow:hidden;background:#111}.video-card img{width:100%;max-height:280px;object-fit:cover}.video-card:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding-left:3px;color:white;border:1.5px solid rgba(255,255,255,.92);background:rgba(0,0,0,.18);font-size:19px;pointer-events:none}.moment-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:#9b9b9b;font-size:10px}.moment-more{border:0;background:#f3f3f3;color:#536b98;width:33px;height:23px;border-radius:5px;font-weight:700;letter-spacing:2px}.moment-comments{margin-top:8px;background:#f5f5f5;border-radius:4px;padding:7px 9px;font-size:12px;line-height:1.6;color:#202020;position:relative}.moment-comments:before{content:'';position:absolute;top:-5px;left:14px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #f5f5f5}.comment-row+.comment-row{margin-top:3px}.comment-name{color:#576b95;font-weight:600}.comment-time{color:#a7a7a7;font-size:9px;margin-left:5px}.comment-sticker{display:inline-grid;place-items:center;background:#ff9d1f;color:white;width:24px;height:24px;border-radius:5px;font-weight:700;font-size:14px;vertical-align:middle}.moment-media img{cursor:zoom-in}

/* found phone / WeChat */
.phone-shell{height:calc(100svh - 58px);background:#ededed;position:relative;padding-bottom:66px;overflow:hidden}.wechat-head{height:54px;display:flex;align-items:center;justify-content:center;background:#f7f7f7;border-bottom:1px solid #d9d9d9;font-size:17px;font-weight:600;position:relative}.wechat-head span{position:absolute;right:18px;font-size:27px;font-weight:300}.wx-panel{height:calc(100% - 54px);overflow-y:auto;padding-bottom:66px}.wx-panel.hide-panel{display:none}.chat-list,.discover-list{background:#fff}.chat-row,.discover-row{width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left}.chat-row{height:78px;padding:10px 14px;display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center}.chat-row img{width:52px;height:52px;border-radius:7px;object-fit:cover}.chat-row b{display:block;font-size:16px;font-weight:500;color:#171717}.chat-row p{margin:6px 0 0;font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-row time{align-self:start;margin-top:6px;font-size:10px;color:#b2b2b2}.discover-spacer{height:9px;background:#ededed}.discover-row{height:58px;padding:0 16px;display:grid;grid-template-columns:32px 1fr 20px;align-items:center;gap:11px;font-size:15px}.discover-icon{width:28px;height:28px;border-radius:6px;background:#7b94be;color:#fff;display:grid;place-items:center;font-size:17px}.discover-row .chev{color:#bdbdbd;font-size:20px}.wechat-tabs{position:absolute;left:0;right:0;bottom:0;height:66px;background:#f7f7f7;border-top:1px solid #d8d8d8;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe);z-index:4}.wechat-tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#777;font-size:9px}.wechat-tab i{font-style:normal;font-size:20px;line-height:1}.wechat-tab.active{color:#07c160}
#chatPage{overflow:hidden}.chat-shell{height:calc(100svh - 58px);background:#ededed;display:flex;flex-direction:column;overflow:hidden}.chat-scroll{padding:12px 11px 14px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.chat-time{text-align:center;color:#aaa;font-size:10px;margin:4px 0 13px}.msg{display:flex;align-items:flex-start;gap:8px;margin:12px 0}.msg.me{justify-content:flex-end}.msg img{width:39px;height:39px;border-radius:5px;object-fit:cover;flex:0 0 39px}.bubble{max-width:72%;padding:10px 12px;border-radius:6px;background:#fff;font-size:14px;line-height:1.55;position:relative;color:#202020;word-break:break-word}.msg.them .bubble:before{content:'';position:absolute;left:-6px;top:14px;border-width:5px 7px 5px 0;border-style:solid;border-color:transparent #fff transparent transparent}.msg.me .bubble{background:#95ec69}.msg.me .bubble:after{content:'';position:absolute;right:-6px;top:14px;border-width:5px 0 5px 7px;border-style:solid;border-color:transparent transparent transparent #95ec69}.chat-inputbar{position:relative;flex:0 0 calc(58px + var(--safe));width:100%;min-height:58px;padding:9px 10px calc(9px + var(--safe));background:#f7f7f7;border-top:1px solid #d8d8d8;display:grid;grid-template-columns:30px 1fr 30px;gap:8px;align-items:start;z-index:2}.chat-inputbar span{font-size:22px;text-align:center;line-height:38px}.chat-inputbar div{height:38px;border-radius:6px;background:#fff}

/* image lightbox */
.photo-viewer{position:fixed;left:50%;transform:translateX(-50%);top:0;bottom:0;width:min(100vw,430px);z-index:150;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.photo-viewer.show{opacity:1;visibility:visible;pointer-events:auto}.photo-viewer img{max-width:100%;max-height:88svh;object-fit:contain}.photo-viewer button{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:white;font-size:24px}

/* mascot toast */
.mascot-toast{position:absolute;left:15px;bottom:104px;padding:9px 13px;background:rgba(255,255,255,.96);border:1px solid rgba(183,132,142,.20);border-radius:16px;box-shadow:0 10px 24px rgba(78,54,63,.14);font-size:12px;color:#6f6066;opacity:0;transform:translateY(8px) scale(.96);transition:.22s;pointer-events:none;white-space:nowrap}.mascot-toast:after{content:'';position:absolute;left:28px;bottom:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid rgba(255,255,255,.96)}.mascot-toast.show{opacity:1;transform:translateY(0) scale(1)}

/* calendar note sheet */
.note-sheet{position:fixed;left:50%;transform:translateX(-50%);top:0;bottom:0;width:min(100vw,430px);z-index:130;background:rgba(63,48,55,.26);backdrop-filter:blur(7px);display:flex;align-items:flex-end;opacity:0;visibility:hidden;pointer-events:none;transition:.22s}.note-sheet.show{opacity:1;visibility:visible;pointer-events:auto}.note-panel{width:100%;background:#fffaf8;border-radius:26px 26px 0 0;padding:18px 17px calc(20px + var(--safe));box-shadow:0 -18px 55px rgba(63,42,50,.16);transform:translateY(22px);transition:.28s}.note-sheet.show .note-panel{transform:translateY(0)}.note-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.note-head strong{font:500 18px Georgia,"Songti SC",serif}.note-close{width:34px;height:34px;border:0;border-radius:50%;background:#f5e9eb;font-size:19px}.note-panel textarea{width:100%;min-height:116px;resize:none;border:1px solid rgba(183,132,142,.24);border-radius:17px;background:#fff;padding:13px 14px;outline:none;font-size:14px;line-height:1.65}.note-actions{display:grid;grid-template-columns:88px 1fr;gap:9px;margin-top:11px}.note-actions button{height:44px;border-radius:14px;border:1px solid var(--line);background:#fff}.note-actions .save-note{background:#827f91;color:#fff;border:0}

/* anniversary */
.ann-bg{min-height:calc(100svh - 58px);padding:18px 14px 35px;background:linear-gradient(160deg,#efe2d3,#d8c0ad)}.old-slip{width:86%;margin:6px auto -14px;padding:18px;background:#f5ead8;box-shadow:0 12px 30px rgba(87,62,45,.14);transform:rotate(-2deg);font-family:"Songti SC",serif;color:#786a61;font-size:13px;line-height:1.8}.new-page{position:relative;background:#fffdf7;border-radius:4px;padding:27px 21px 36px;box-shadow:0 18px 45px rgba(74,51,38,.17);transform:rotate(.4deg)}.new-page h2{font-family:"Songti SC",serif;font-size:24px;font-weight:500;margin:0 0 20px}.new-page p{font-family:"Songti SC",serif;font-size:15px;line-height:2;margin:0 0 10px}

.qixi{position:fixed;left:50%;transform:translateX(-50%);top:0;bottom:0;width:min(100vw,430px);z-index:120;background:rgba(78,59,67,.40);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px 14px calc(20px + var(--safe));opacity:0;pointer-events:none;transition:.25s}.qixi.show{opacity:1;pointer-events:auto}.qx-close{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));width:39px;height:39px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:21px;z-index:4}
.envelope-stage{width:100%;height:82svh;max-height:720px;position:relative;display:flex;align-items:center;justify-content:center;overflow:auto}.envelope{width:300px;height:190px;position:relative;transition:.7s cubic-bezier(.2,.7,.2,1);filter:drop-shadow(0 22px 32px rgba(53,36,43,.22))}.env-back{position:absolute;inset:0;border-radius:12px;background:#e4b1b9}.env-back:before{content:"";position:absolute;inset:0;background:linear-gradient(32deg,#d49ca6 49.5%,transparent 50%),linear-gradient(-32deg,#d49ca6 49.5%,transparent 50%);border-radius:12px}.flap{position:absolute;left:0;right:0;top:0;height:142px;clip-path:polygon(0 0,100% 0,50% 100%);background:#efc6cd;transform-origin:50% 0;transition:.65s;z-index:2}.seal{position:absolute;left:50%;top:86px;transform:translateX(-50%);z-index:3;width:49px;height:49px;border:0;border-radius:50%;background:#b87483;color:#fff;font-size:21px;box-shadow:0 6px 15px rgba(95,48,60,.22);animation:sealPulse 2s ease-in-out infinite}.letter-sheet{position:absolute;left:11px;right:11px;top:18px;height:0;overflow:hidden;background:#fffaf3;border-radius:4px;z-index:1;transition:.75s cubic-bezier(.2,.72,.2,1);opacity:0}.envelope.open{height:72svh;max-height:650px;align-self:flex-start;margin-top:25px}.envelope.open .flap{transform:rotateX(180deg);z-index:0}.envelope.open .seal{opacity:0;pointer-events:none}.envelope.open .letter-sheet{top:-7px;height:72svh;max-height:650px;opacity:1;z-index:4;overflow:auto;padding:26px 21px 42px;box-shadow:0 17px 42px rgba(63,42,50,.19)}.letter-sheet h2{font-family:"Songti SC",serif;font-weight:500;font-size:24px;margin:0 0 19px}.letter-sheet p{font-family:"Songti SC",serif;font-size:15px;line-height:2;margin:0 0 10px}.letter-sheet p:last-child{text-align:right;margin-top:20px}@keyframes sealPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}

/* mascots */
.mascots{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,430px);height:0;z-index:65;pointer-events:none}.doll{position:absolute;bottom:max(0px,var(--safe));width:108px;pointer-events:auto;filter:drop-shadow(0 9px 13px rgba(71,47,55,.17));transform-origin:50% 88%;will-change:transform}.girl{left:-1px;animation:girlWander 4s ease-in-out infinite}.boy{right:-1px;animation:boySneak 10.5s cubic-bezier(.45,0,.22,1) infinite}.doll.squish{animation:squish .44s ease!important}.boy.quick{animation:boyQuick 3.1s cubic-bezier(.42,0,.22,1)!important}.heartpop{position:absolute;left:104px;bottom:94px;font:31px Georgia,serif;color:#d68496;opacity:0;animation:heartVisit 10.5s ease-in-out infinite}.heartpop.quick{animation:heartQuick 3.1s ease-in-out!important}
@keyframes girlWander{0%,100%{transform:translateX(0) rotate(-1deg)}50%{transform:translateX(14px) rotate(1.5deg)}}

@keyframes heartVisit{0%,29%,70%,100%{opacity:0;transform:translateY(8px) scale(.6)}39%,61%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-8px) scale(1.15)}}
@keyframes heartQuick{0%,32%,80%,100%{opacity:0}43%,68%{opacity:1;transform:translateY(-6px) scale(1.1)}}

const DATA={"diaries": [{"date": "2023.07.16", "iso": "2023-07-16", "paras": ["今天在灵隐寺遇见了一个人，说是“遇见”，其实有点突然。", "当时周围人不少，我刚侧过身，她就从前面撞了过来，我下意识伸手扶住她，等人站稳了，才发现她鼻梁上的金属圆框眼镜被撞歪了一点。", "她自己大概也有些没反应过来，先扶了扶眼镜，才抬头跟我道歉。", "“抱歉，刚刚没注意到。”", "“没事。”", "我看了她一眼：“撞疼了吗？”", "她摇摇头。", "“那就好。”", "话说到这里，这段对话本来应该结束了，可她把眼镜重新扶正以后，又抬头看向我。", "我们的视线猝不及防地触碰，交缠，闪避。", "我开始反省是不是我看向她的时间太久，是不是我没有表情的时候看起来有些凶？所以她才会低下头。", "我不自然地侧过身，余光却还是看向她，她发尾有一点灰蓝色，刚才被人群挡着没怎么看清，现在离得近，才发现颜色很清浅。", "风从旁边带过，发尾偏向我。", "很奇怪。", "明明只是在人群里发生的一件小事，我却突然不太想就这么走了。", "好在我一向自来熟，于是我又和她聊了几句，也是那时候知道她叫菁菁。", "菁菁。", "回来的路上，我在心里又念了一遍。", "今天见过的人很多，照理说这么短的一面，转身以后很快就该忘记了。", "可直到现在，我脑子里偶尔还会冒出刚才的画面，她撞过来的时候有点措手不及，扶正眼镜以后又安静地抬头看我。", "一见钟情，我从前只以为是恋爱中情侣的万能托词，一个人连另一个人是什么样子都不了解，凭一眼能确定什么？", "可是我已经了解她叫菁菁了，我们之后还会有更多了解，更多接触，我会越来越了解她…", "好短的一段路，这么短暂的路程居然能承载我脑海里虚构的一生。", "我不自在地摆弄着新买的日记本，嗯，记下这奇怪的一天。"], "label": "灵隐寺", "preview": "今天在灵隐寺遇见了一个人，说是“遇见”，其实有点突然。"}, {"date": "2025.4.13", "iso": "2025-04-13", "paras": ["今天开车的时候，菁菁突然把手伸过来，我自然顺手牵住。", "结果她低头把我袖口折进去一点，又把手收回去了。", "“这里翻出来了。”", "我看着她坏心思地看着我，突然想起我们刚在一起时搞怪后都要低下头憋笑的笨蛋小猫，憋笑的时候身子都在抖动，让人一眼就能看了出来。", "而当初还会遮掩一下的小笨蛋现在已经炉火纯青地使坏，一副我就是坏猫你又能奈我何的模样。", "那作为坏猫拥有者的萧逸只能看了看前面还有几十秒的红灯，接着不讲道理地抓住了她的手。", "手指挤了进去，她仰着小脸得意地说：", "“啧啧啧，萧老板实在是太缠人了，开车都得牵手。”", "我被她逗笑，牵得更紧，“没办法，就算是萧逸也不能离开小猫的爪子。”", "一边说着一边把玩着她的手指，", "“菁菁愿意包容黏人的哥哥吗？”", "“愿意的！咳…那我勉为其难包容一下吧。”", "我们家坏蛋小猫的表象下其实藏着一只小乖猫。"], "label": "红灯", "preview": "今天开车的时候，菁菁突然把手伸过来，我自然顺手牵住。"}, {"date": "2025.8.17", "iso": "2025-08-17", "paras": ["晚上和菁菁去了趟超市，本来说只是去补一点家里用完的东西，结果进去以后某人推着购物车一路走走停停，看见什么都想研究一下。", "我也不急，就跟在旁边慢慢陪她逛。", "走到冷柜前，她拿着两个口味来回比较了很久，我站在旁边看了半天，最后替她做决定：“左边。”", "菁菁回头：“为什么？”", "“我猜测你更喜欢这个。”", "她又看了一遍，最后很听话地把左边放进购物车。", "我有点意外：“这么相信哥哥？”", "她理所当然地点头：“不好吃就给哥哥。”", "“那好吃呢？”", "“好吃当然是我的。”她一副理直气壮的样子，我忍不住笑出声，这只猫的算盘珠子应该已经崩到我脸上。", "逛到后面冷气越来越重，出门前还信誓旦旦说自己不冷的人慢慢靠过来，把手直接伸进了我的外套口袋。", "我低头看向她，似乎察觉到我的目光，她神色坦荡：“借一下哥哥的口袋取暖。”", "“只借口袋？”", "她眨眨眼：“不然呢？”", "我的手在口袋里摸索过去，接着紧紧握住了她的。", "“口袋不单独出租，附赠一个哥哥。”", "她想抽出去，被我握得更紧，于是只能一只手推着购物车往前走。", "走了一会儿终于开始抗议：“哥哥，我这样怎么推车？”", "我故意低头看了一眼我们牵在一起的手，“那怎么办，总不能把哥哥丢掉吧。”", "“可以暂时放一小下下。”", "“小没良心的。”", "最后购物车当然归了我，她空出来的手继续被我牵着。", "结账以后我拎着几个袋子，她伸手过来说：“给我一个。”", "我非常自然地把自己的手放进她掌心，菁菁低头看看我，又看看袋子：“我是说这个。”", "“这个轻。”我晃了晃她牵住的手，“适合菁菁。”", "她被逗得笑起来，最后也没松开。", "其实超市没什么特别的，买了几样东西，绕了几排货架，再一起走回家。", "但我最近好像越来越喜欢这种事情。", "以前觉得生活里大部分琐碎都没什么值得记的。", "现在身边多了一只小猫以后，连逛超市都变得有点意思。"], "label": "超市", "preview": "晚上和菁菁去了趟超市，本来说只是去补一点家里用完的东西，结果进去以后某人推着购物车一路走走停停，看见什么都想研究一下。"}, {"date": "2025.12.21", "iso": "2025-12-21", "paras": ["今天回来得有点晚，训练结束的时候已经很晚了。", "菁菁发消息问我还有多久，我回她：", "“我马上就到家了，如果回家以后让哥哥发现某人还没睡……”", "“我马上就要睡了！”", "我几乎能想象到她说这句话的语气，表情，心虚的小朋友怎么看都不像是真的要休息。", "果然，回去的时候，她还醒着。", "我刚进门，她就走过来抱住我，脸埋在肩膀上，也不说话。", "“我~马~上~就~要~睡~啦~”我学着她的语气戏谑道，揉了揉她的头发，将她抱得更紧，更紧。", "按理说某人现在应该会佯装生气，可是她却只是蹭蹭我的颈窝，心更软了，原本还打算好好念叨念叨的心思瞬间歇了下去。", "小猫能有什么坏心思？她只是太想念我了。", "“我一个人睡不着。”闷声闷气的声音从怀里传来。", "“那现在是两个人了，菁菁是不是太想哥哥了？”", "她在我怀里安静了一会，“有一点。”", "我低头用下巴点了点她的头顶：“只有一点？”", "怀里的小猫猛得起来似乎是想亲我，却不小心撞上了我的下颌，有力气的宝宝。", "我揉了揉下巴，故意吓她：“菁菁磕得哥哥好痛啊……”", "她果然慌了神，整张脸都凑了上来，凑到了我眼前，发丝落在我颈侧，近看小猫是一种享受。", "好萌。", "不过菁菁并不知道我的想法，急急忙忙地开口：“很痛吗？哥哥我不是故意的，对不起…”", "“既然对不起的话那就好好补偿一下哥哥吧~”", "人类总是会逞小猫不注意抱起来带到自己的房间，", "“萧逸！你又哄我！”", "“嗯哼，把菁菁哄回来继续刚才想做的事情。”", "“我才没有想亲你…总是逗我……”", "“没办法，哥哥已经在外面待了一整天，离开小猫的空气都是苦的，好难闻。”", "于是我就这样吸了一晚甜甜的菁猫猫。"], "label": "晚归", "preview": "今天回来得有点晚，训练结束的时候已经很晚了。"}, {"date": "2026.3.2", "iso": "2026-03-02", "paras": ["今天下了一下午的雨。", "原本计划出去，最后两个人谁都懒得折腾，菁菁抱着毯子窝在沙发里看综艺，我也顺势坐到了旁边。", "刚开始小猫坐得还挺规矩，半小时以后肩膀慢慢靠过来，再往后，节目里不知道出了什么笑点，她整个人笑得往我身上倒。", "我顺手把人接住，菁菁笑完以后还想重新坐好，被我扣着腰留在怀里。", "“哥哥干什么？”", "“菁菁自己送上门的，不是吗？”", "“我是笑倒的呀。”", "“到了哥哥这里还分原因？”", "她被我说得没话讲，索性重新找了个舒服的位置靠着，腿也慢慢蜷到了沙发上。", "我们家小猫戳一下不会生气，她只会顺势躺在我掌心里。", "看到下一期的时候，她伸手去够遥控器却被我提前拿走。", "菁菁抬头：“哥哥——”", "“先回答哥哥一个问题嘛~”我学着她撒娇的样子。", "她开始警惕：“什么？”", "“刚才最好笑的是哪段？”", "她认真回忆了一会儿，说着自己的想法，我若有所思地点头。", "“原来菁菁真的只顾着看综艺。”", "她愣了一下才反应过来，忍着笑问：", "“……”", "“哥哥你连综艺的醋都吃！”", "“那倒没有。”我低头看她，“就是怀里坐了个人这么久，还以为多少能分到一点注意力。”", "菁菁盯了我几秒，像是终于看透了某位萧老板的真实目的。", "下一秒她伸手捏住我的脸，左右看了看。", "“现在注意到了。”", "“就这样？”", "“那哥哥还想怎么样？”", "问得很好，我还没回答，她已经迅速转过脸，一本正经地宣布：“看综艺。”", "跑得倒快。", "我把遥控器重新递给她，又将怀里的人往自己这边带了带。", "“好，看综艺。”", "反正外面的雨还没停。", "今天时间很多，某只故意装傻的小猫，可以慢慢清算。"], "label": "雨天", "preview": "今天下了一下午的雨。"}, {"date": "2026.5.24", "iso": "2026-05-24", "paras": ["今天和菁菁一起去了猫咖。", "刚进去没多久，她旁边就已经围了三只，腿上一只，旁边一只，还有一只不停拿脑袋蹭她的手。", "菁菁摸得特别认真，低着头完全没发现我已经在对面看了她很久。", "等她终于舍得抬头，第一句话居然是：“哥哥怎么不摸猫？”", "“嘘，哥哥正在看呢。”", "“看什么？”", "我看了看她，又看了看她怀里那一群，“看你们认亲。”", "菁菁愣了一下，随后笑得眼睛都弯了起来：“什么认亲？”", "“这么黏人，还不算同类？”", "她低头摸了摸腿上的猫，很认真地宣布：“它比我乖。”", "“这倒是。”", "话音刚落，某只自称很乖的小猫立刻抬头看我。", "我慢悠悠补充：“至少它不会故意逗哥哥。”", "“我什么时候逗你了？”", "很好，还学会装失忆了。", "后来她腿上的猫终于跳下去，我刚准备过去坐到旁边，另一只又抢先跳了上来。", "我停在原地看了几秒，菁菁已经发现了，明知故问地抬头：“哥哥是不是想坐这里？”", "“看出来了？”", "她笑得更开心：“可是没位置啦。”", "甚至还故意低头摸了摸新来的那只猫，得意小猫。", "我坏心眼地把她拉了起来，", "“干什么？”", "“给菁菁换个位置。”", "她虽然疑惑，还是把手交给我，等人被我拉起来以后，我很自然地在她原来的位置坐下，抬头看着站在面前的小猫。", "菁菁终于反应过来：“那我坐哪里？”", "我挑眉，“完全送分题，我们家聪明小猫一定能发现。”", "我伸手把人揽住，刚才那只猫还不死心，又绕到我们脚边转了两圈。", "我低头看它，“晚了，位置已经有人了。”", "菁菁笑着推我：“幼稚鬼，哥哥怎么还跟猫抢位置。”", "我握住她的手，很坦然地点头，“是有一点幼稚。”", "不过没办法，别的地方可以让，菁菁旁边的位置不太想让。"], "label": "猫咖", "preview": "今天和菁菁一起去了猫咖。"}, {"date": "2026.7.18", "iso": "2026-07-18", "paras": ["今天和菁菁一起拼豆，刚开始的时候某位自称经验丰富的小老师还坐在旁边指导我，告诉我这个应该怎么放，那个颜色别拿错，说话的时候一副“哥哥第一次玩一定需要我照顾”的模样。", "我听了半天，看了一眼她手里刚刚放歪又偷偷挪回去的那颗拼豆。", "我当然没拆穿，我们小老师也是需要面子的。", "后来我们各自拼各自的，我把手边的盒子竖起来挡在中间，菁菁很快发现了不对，身体慢慢往我这边倾。", "“哥哥在拼什么？”", "“是秘密哦。”", "她又往前一点，我把盒子也往前挪了一点。", "我们两个隔着盒子来来回回好几次，她终于忍不住伸手过来，结果被我先一步抓住了手腕。", "“菁菁就这么好奇哥哥的一切？”", "“我只是想看一眼而已嘛。”", "“刚才谁说各拼各的，不许偷看？”", "菁菁理亏了一秒，很快转换策略，软着声音叫：“哥哥。”", "……", "某些小猫确实很会利用自己的优势。", "我低头继续摆拼豆，故意装作没听见：“叫哥哥也没用。”", "“哥哥——”尾音拖得比刚才更长。", "我没忍住笑了，捏了捏她伸过来的手指，接着牵着她的手指戳了戳我的脸颊，", "“菁菁亲我一下，我就考虑考虑。”她这次终于发现我是故意逗她，抽回手轻轻打了我一下。", "最后当然还是没有提前给她看，这是给菁菁的惊喜，等她低头忙自己的，我才把最后几颗灰蓝色拼豆放好。", "是一只戴着圆框眼镜的小猫。", "做完以后越看越觉得有点像，小猫为什么做人萌，做画萌，成人萌，Q版萌，拼豆也萌。", "菁菁看到以后立刻认了出来，“哥哥是在拼我？”", "“这么明显？”", "“为什么是猫猫？”", "我抬眼看她，这个问题居然还需要问。", "“菁菁觉得呢？”", "她一下就懂了，抱着那只拼豆小猫笑得萌萌的，又很自然地宣布：“那这个归我。”", "“哥哥拼的，怎么就归你了？”", "“因为是我呀。”", "有理有据。", "我居然无法反驳，最后小猫本人抱着小猫战利品离开，只剩萧老板坐在原地思考自己忙了半天究竟得到了什么。", "算了，下次再拼一只，这次拼哥哥，然后把两只挂在一起。"], "label": "拼豆", "preview": "今天和菁菁一起拼豆，刚开始的时候某位自称经验丰富的小老师还坐在旁边指导我，告诉我这个应该怎么放，那个颜色别拿错，说话的时候一副“哥哥第一次玩一定需要我照顾”的模样。"}], "notes": [{"no": "01", "paras": ["菁菁摘了眼镜以后是真的看不清，今天隔着一点距离叫她，她眯着眼睛往这边看了半天，最后自己往前凑了两步才认出来。", "像只刚睡醒、还没完全睁开眼的小猫。", "本来想再逗一会儿，算了，下次还是站近点。"]}, {"no": "02", "paras": ["第一次发现菁菁吃到特别喜欢的东西，嘴巴里就只有食物，不怎么和我讲话了。", "下次或许可以考虑带她去难吃的餐厅（？）", "不过眼睛倒是亮晶晶的，今天那道番茄鱼应该很合她胃口，第一口下去以后眼睛都亮了一点，后面跟她说话也只顾着点头。", "问她听见没有，她说：“听见了呀。”", "小馋猫。", "不过下次我们还是去她喜欢的餐厅吧。"]}, {"no": "03", "paras": ["菁菁看书的时候很容易把周围忘掉，今天坐她对面二十多分钟，她抬头才发现我一直在。", "问我怎么不叫她。", "因为她不知道，我也看入迷了。", "她低着头看书的时候很安静，翻页也慢，看到喜欢的地方嘴角时不时地勾起。", "菁菁总是想不明白为什么哥哥会动不动就凑上去亲亲她，就像小猫也想不明白明明自己只是在发呆而已人类却这么喜欢它。"]}, {"no": "04", "paras": ["最近发现菁菁叫“哥哥”的声音真的有很多种。", "平常找我的时候是很自然的一声，想让我帮忙的时候会不自觉把尾音拖长一点，至于什么都不说，只坐到旁边盯着我，一声接一声地叫哥哥……", "一般代表某只猫正在撒娇。", "今天她就是这样，凑过来以后先叫了一声，我答应了，她又叫。", "“哥哥。”", "“嗯。”", "“哥哥。”", "“我在。”", "叫到第三遍，我干脆伸手把人捞进怀里。", "她果然一下安静了。", "所以有时候菁菁嘴巴说了很多话，其实翻译过来也就一句，哥哥，抱我。", "这个哥哥已经学会了。"]}, {"no": "05", "paras": ["菁菁身上有很多软乎乎的地方。", "脸颊软，抱进怀里的时候也软，尤其是小腹那一块，手搭上去的时候总让人舍不得拿开。", "今天又被她抓了现行。", "她低头看看我的手，又抬头看看我，问：“哥哥是不是又偷偷摸我肚子？”", "我说只是刚好放在那里，菁菁一副完全不相信的表情，伸手按住我的手背。", "但是也没有拿开。", "于是我们两个就维持着一个“菁菁明知道哥哥在摸，哥哥也知道菁菁知道”的状态继续窝了一会儿。", "小猫的肚子本来就是软的。", "作为小猫拥有者，摸两下很合理吧。", "……反正我觉得很合理。"]}, {"no": "06", "paras": ["以前还以为菁菁主动亲人的时候会有点害羞，后来发现我想多了。", "她想亲是真的会亲。", "我在说话，她突然凑过来亲一下；准备出门了，已经走到门口又折回来亲一下，有时候只是坐在一起，她看我半天，然后非常自然地靠过来。", "亲完还一副什么都没发生的样子。", "有一次我故意拉住她问：“菁菁刚才是在占哥哥便宜？”", "她很坦然地点头：“对呀。”", "……", "行。", "这么坦荡的小色猫确实不太好抓把柄。", "不过没关系。", "她占一次，哥哥一般会还两次。", "怎么算都是我赚。"]}, {"no": "07", "paras": ["菁菁喜欢戴着耳机听歌，耳机一戴，像是真的把外面的声音暂时关掉了，有时候我从旁边经过，她都不会马上发现。", "今天我也没叫她，只在旁边坐下来做自己的事。", "过了一会儿，她忽然摘下一边耳机，侧头看我。", "“哥哥要听吗？”", "然后很自然地把另一只递过来。", "一副耳机，两个人各戴一边，谁都没有说话。", "菁菁后来慢慢靠到我肩上，我闻到她头发上的味道，突然觉得挺奇怪的，她明明是在做一个人的事情却总能在某个瞬间给我留一点位置。", "可能小猫所谓的独处就是这样，自己待一会儿，再过来贴贴哥哥。"]}, {"no": "08", "paras": ["今天第一次认真听菁菁洗澡唱歌。", "不过也不能叫第一次听见，只是以前没这么认真听。", "她大概以为浴室门一关，外面的人就自动失去听觉，唱到喜欢的地方声音还会变大一点，中间有一句词忘了，停了两秒，居然非常镇定地用哼哼混了过去。", "出来以后她还试探着问：“哥哥刚才是不是在看视频？”", "我点头。", "她明显松了一口气，我没告诉她视频早就播完了。", "不过这件事暂时还是不要让本人知道。", "不然以后洗澡不唱了怎么办。", "那哥哥损失有点大。"]}, {"no": "09", "paras": ["菁菁在人多的时候会比平常安静一点。", "以前没有特别注意，最近才发现，有些当时没说出口的话，她会留到我们两个单独待着的时候再慢慢讲。", "比如今天回来的路上，她突然从半小时前看到的一只狗讲起，又讲到路边的店，再绕到刚才遇到的人，想到什么说什么，完全没有固定顺序。", "我就在旁边听，偶尔应两句，她就能继续讲很久，别人可能会觉得菁菁话不算多。", "但是哥哥知道她的话都藏在哪里，有一部分藏在安静里，还有一部分，大概专门留给了她的男朋友，我。"]}, {"no": "10", "paras": ["菁菁撒娇的时候经常不承认自己在撒娇。", "今天坐得好好的，先往我这里挪了一点，过了一会儿又挪一点。", "最后肩膀都贴上来了，还一副只是碰巧坐到这里的样子。", "我问：“菁菁是不是想让哥哥抱？”", "她看我一眼：“哥哥自己猜。”", "这种问题有什么好猜的。", "我直接伸手把人抱过来了。", "她在怀里笑，说我作弊。", "可是小猫都已经把自己送到手边了，还要求哥哥坐在那里认真解题，是不是有点太为难人。"]}, {"no": "11", "paras": ["今天发现菁菁有时候会偷偷盯着我看。", "也算不上偷偷，因为她的隐藏技术实在一般。", "我一转头，她就移开视线；等我重新做自己的事，没一会儿又看回来。", "来回几次以后，我干脆不动了，直接看回去。", "这次轮到她先开口：“哥哥为什么一直看我？”", "？", "小猫现在已经学会恶人先告状了。", "我问刚才是谁先看的，她说不知道。", "最后我们两个对视了半天，也没有讨论出到底是谁先开始。", "不过这件事后来有了一个很好的解决方式。", "既然都已经靠这么近了。", "那就亲一下。", "事实证明，接吻确实可以解决很多无意义的争论。"]}, {"no": "12", "paras": ["菁菁睡迷糊的时候，好像会先找我。", "今天早上我醒得早一点，没有动，就躺在那里看她睡。", "过了一会儿，她闭着眼睛摸索了半天，手先碰到我的胳膊，又慢慢往上，确认我还在以后就不动了，只往这边靠了一点。", "整个过程眼睛都没睁，看起来像某种小动物确认自己的窝还在不在。", "我本来想继续装睡，看她还会做什么，结果什么都没做。", "找到哥哥以后，她又安心睡着了。", "……", "早知道就直接把人抱过来。", "算了，下次吧，反正按照菁菁这个睡觉习惯，哥哥应该还有很多实验机会。"]}, {"no": "13", "paras": ["最近发现一个很有意思的变化。", "刚认识的时候，菁菁被我逗一下还会努力藏一藏表情，现在已经越来越会还手了。", "我说一句，她能接一句，我故意靠近，她有时候甚至会先一步凑过来，然后看着我笑，摆明了就是在说来啊。", "小猫胆子养得越来越大。", "按理说作为哥哥，应该稍微反省一下是不是平时太纵容她。", "但是想了想，好像也没什么好反省的，她这样挺可爱的，而且只有哥哥一个人欺负小猫确实没什么意思。"]}, {"no": "14", "paras": ["翻到最前面看了一遍，突然觉得这份记录有点奇怪。", "最开始连菁菁摘掉眼镜会眯着眼睛看人，都觉得新鲜得想记下来，现在很多事情已经熟悉到根本不需要想。", "她什么时候只是想安静一会儿，什么时候其实是在等哥哥过去；哪种笑是真的开心，哪种笑说明某只猫刚刚使了坏；她靠过来的时候要不要抱，她突然亲一下以后应该怎么还回去——", "好像都已经变成很自然的事了。", "但是翻回去看，还是觉得很可爱。", "原来以前第一次发现这些东西的时候，我是这么想的。", "所以还是继续记吧。", "毕竟菁菁这只猫养了这么久，也没有越来越好懂。", "反而每天都有一点新的，挺好，哥哥慢慢研究。"]}], "letter": ["七夕｜给菁菁", "菁菁：", "七夕快乐。", "写下这句话的时候，我突然想到，你看到这里大概会先笑一下，然后问我，萧老板什么时候也开始正经写情书了。", "提前回答你。", "今天。", "机会难得，小猫先别打岔，让哥哥说完。", "认识你以后，我越来越觉得，喜欢一个人是一件很具体的事。", "比如走在路上，会习惯性看看身边的人有没有跟上；看到什么有意思的东西，第一反应是下次带你来；训练结束拿到手机，会先看看有没有你的消息。", "忙的时候也会突然想起来，菁菁现在在干什么，是抱着书，窝着看剧，还是戴上耳机躲进自己的小世界里去了。", "有时候什么都没发生，也会想你。", "以前我总觉得，想见就去见，想做什么就去做，没必要把很多东西留到以后。", "现在依然这么觉得，只是身边多了一个你以后，“以后”好像也变得很值得期待。", "下一次一起出去，下一顿饭，下一场电影，下一段晚风，甚至下一个什么安排都没有的晚上。", "只要里面有菁菁，就都可以先留个位置。", "你很喜欢黏着我，这一点哥哥很满意。", "虽然偶尔嘴上会问一句“今天怎么这么黏人”，其实你再靠近一点，哥哥只会更开心。", "如果菁菁哪天什么都不想做，只想一个人安静待着，也不用担心我会觉得被冷落。", "你有你自己的世界，我喜欢看你待在里面，也喜欢看你待够了以后，又慢慢往我这里靠。", "以前有人问过我，喜欢一个人以后会不会觉得麻烦。", "现在想想，麻烦确实多了不少。", "会记得天气，记得时间，记得某个人有没有好好吃饭；会在出门以后多看一个位置，会在回家的路上加快一点速度。还会越来越贪心。", "见到你以后想抱，抱到了又想亲，亲完了还想让你再陪我待一会儿。", "没办法。", "菁菁自己招惹的。", "而且你最近也越来越会欺负哥哥了。", "有时候明知道我在看你，还故意装作没发现；有时候撒完娇就准备跑，觉得事情到这里就结束了。", "写到这里好像又跑题了。", "本来想认真说一点什么。", "那就再认真一点，菁菁，我很喜欢你。", "喜欢你安静的时候，也喜欢你靠过来的时候；喜欢你有自己的想法，也喜欢你偶尔很理直气壮地来找哥哥撑腰。", "你可以一直变化，换新的爱好，有新的习惯，喜欢以前没喜欢过的东西，也可以偶尔改变主意。", "毕竟我想认识的，本来一直都是小猫。", "去年的，今年的，明年的，后年的，再往前的，再往后的，也一样。", "所以你放心前进，哪天走快了，哥哥跟上，哪天走累了，就停下来靠一会儿，想去什么地方，我们一起去，突然不想去了，也可以临时掉头。", "反正我的终点一直都在你这里。", "七夕快乐，菁菁。", "我爱你。", "——萧逸"], "anniversary": ["2026.07.16三年后，再翻到这一天", "今天重新翻到了三年前的日记，应该说是菁菁先翻出来的。", "那本日记已经很久没有动过了，被压在最下面，她拿起来的时候还问我：", "“哥哥居然真的有好好写日记？”", "语气听起来非常不可思议。", "我伸手把本子拿回来，没让她继续翻，“怎么，哥哥看起来不像有这个耐心？”", "她很诚实地点头。", "行，三周年第一笔账我将记下。", "后来菁菁去洗漱，我一个人坐在床边，还是重新把日记翻到了最开始。", "2023年7月16日。", "纸页已经有一点旧了，上面的字倒没怎么变。", "我看到自己写：", "“一见钟情，我从前只以为是恋爱中情侣的万能托词。”", "看到这里的时候没忍住笑了一下，三年前的萧逸还挺嘴硬。", "明明回去的路上已经把一个刚认识没多久的姑娘想了不知道多少遍，连以后会发生什么都在脑子里擅自演了一场，还要一本正经地研究那到底算不算一见钟情。", "现在再回答这个问题简单多了。", "算。", "当然算。", "再往下看，是那句：", "“可是我已经了解她叫菁菁了，我们之后还会有更多了解，更多接触，我会越来越了解她……”", "当时写下这句话的时候，我其实什么都不知道。", "不知道菁菁原来会那么黏人，不知道她后来会一声一声地叫哥哥，更不知道她靠进怀里的时候比第一次撞进来还要自然。", "不知道她看不清的时候会眯着眼睛往我这边凑，不知道她心情好起来会莫名其妙多亲几次，也不知道有一天，我只听她叫一声“哥哥”，就差不多能猜出她下一秒是想撒娇、想找我，还是又准备使什么坏。", "三年前的我只知道一个名字。", "现在这个名字后面已经有了太多东西。", "我翻着以前的字，突然想起那天从灵隐寺离开的时候。", "那段路确实很短，短到真正发生的事情只有一次意外的碰撞，几句普通的交谈，还有一个刚刚记住的名字。", "可那时候我居然已经在想，以后会不会再见她，会不会更了解她。", "甚至写了一句——“好短的一段路，这么短暂的路程居然能承载我脑海里虚构的一生。”", "现在看来，“虚构”两个字应该划掉。", "因为后来真的有了很多路，一起走过热闹的街，也走过晚上没什么人的小路；她偶尔牵着我的手慢慢走，偶尔又会走到一半突然靠过来。还有很多我当时根本想不到的普通日子，普通到只是一起吃饭、一起回家、坐在同一个房间里各做各的事。", "原来所谓“一生”真落到眼前以后，没有我当时想得那么轰轰烈烈。", "它更像是这些东西一点一点累积起来。", "是我越来越了解菁菁，菁菁也越来越了解我。", "是第一次见面时还会因为多看对方几秒而不自然的人，现在已经可以理直气壮地盯着我看半天，被抓到了还问：“哥哥为什么一直看我？”", "想到这里的时候，浴室门刚好打开。", "菁菁一边擦头发一边走出来，看见我还拿着那本日记，立刻凑过来。", "“哥哥到底写了什么？”", "我把日记合上。", "“秘密。”", "她明显不满意，伸手就想拿。", "我躲了一下，她又往前追，最后整个人都扑到我身上，被我顺势抱住。", "三年前第一次接住她的时候，我还不知道怀里这个人叫什么。", "现在倒好，小猫连扑人的动作都越来越熟练了。", "菁菁还在惦记那本日记：“给我看一下。”", "“现在不行。”", "“为什么？”", "我低头看她。", "“因为三年前有人撞进哥哥怀里，现在想知道后续，总得付点阅读费吧。”", "她一听就知道我又在逗她，仰起脸：“哥哥想要什么？”", "这个问题也比三年前好回答多了，我笑着低头靠近她。", "三年前在那段很短的路上，我凭空想过很多关于以后的事情。", "现在怀里这个人，就是答案。", "而且比当时想得还好。", "三周年快乐，菁菁。"]};

function momentMedia(m){
  if(m.imgs.length>1) return `<div class="moment-media moment-grid">${m.imgs.map(u=>`<img class="zoomable" src="${u}" alt="朋友圈图片">`).join('')}</div>`;
  const u=m.imgs[0]; if(m.video) return `<div class="moment-media video-card"><img class="zoomable" src="${u}" alt="朋友圈视频画面"></div>`;
  return `<div class="moment-media"><img class="moment-single zoomable" src="${u}" alt="朋友圈图片"></div>`;
}
function comments(m){
 let rows=[];
 if(m.self) rows.push(`<div class="comment-row"><span class="comment-name">菁菁：</span>${escapeHtml(m.self)}${m.selfTime?`<span class="comment-time">${m.selfTime}</span>`:''}</div>`);
 if(m.selfSticker) rows.push(`<div class="comment-row"><span class="comment-name">菁菁：</span><span class="comment-sticker">${escapeHtml(m.selfSticker)}</span></div>`);
 rows.push(`<div class="comment-row"><span class="comment-name">萧逸：</span>${escapeHtml(m.reply).replace(/\n/g,'<br>')}</div>`);
 return `<div class="moment-comments">${rows.join('')}</div>`;
}

// Anniversary
function renderAnniversary(){ const [title,...ps]=DATA.anniversary; $('#annBody').innerHTML=`<h2>${escapeHtml(title)}</h2>${ps.map(p=>`<p>${escapeHtml(p)}</p>`).join('')}`; }

// Calendar
const START=new Date(2023,6,16,0,0,0); let cursor=new Date(); cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
const CAL_NOTE_KEY='yizuijingnian-calendar-notes-v1';
let calendarNotes={}; try{calendarNotes=JSON.parse(localStorage.getItem(CAL_NOTE_KEY)||'{}')||{}}catch(e){calendarNotes={}}
let activeNoteKey='';
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function sameDate(a,y,m,d){return a.getFullYear()===y&&a.getMonth()===m&&a.getDate()===d}
function openNote(key,y,m,d){activeNoteKey=key;$('#noteDate').textContent=`${y}.${String(m+1).padStart(2,'0')}.${String(d).padStart(2,'0')}`;$('#noteInput').value=calendarNotes[key]||'';$('#noteSheet').classList.add('show');setTimeout(()=>$('#noteInput').focus(),220)}
function closeNote(){ $('#noteSheet').classList.remove('show'); }
function persistNotes(){try{localStorage.setItem(CAL_NOTE_KEY,JSON.stringify(calendarNotes))}catch(e){} renderCalendar()}
$('#noteClose').onclick=closeNote; $('#noteSheet').onclick=e=>{if(e.target===$('#noteSheet'))closeNote()};
$('#saveNote').onclick=()=>{const v=$('#noteInput').value.trim();if(v)calendarNotes[activeNoteKey]=v;else delete calendarNotes[activeNoteKey];persistNotes();closeNote()};
$('#deleteNote').onclick=()=>{delete calendarNotes[activeNoteKey];persistNotes();closeNote()};
function renderCalendar(){ const y=cursor.getFullYear(),m=cursor.getMonth(); $('#calMonth').textContent=`${m+1}月`; $('#calYear').textContent=String(y); const box=$('#calendarDays'); box.innerHTML=''; const first=new Date(y,m,1).getDay(), count=new Date(y,m+1,0).getDate(); for(let i=0;i<first;i++){const x=document.createElement('span');x.className='day muted';box.appendChild(x)} const now=new Date(); for(let d=1;d<=count;d++){const b=document.createElement('button');const key=dateKey(y,m,d);b.className='day';b.textContent=d;if(sameDate(now,y,m,d))b.classList.add('today');if(m===6&&d===16)b.classList.add('start');if(calendarNotes[key])b.classList.add('has-note');if(y===2026&&m===7&&d===19)b.onclick=openQixi;else b.onclick=()=>openNote(key,y,m,d);box.appendChild(b);} }
$('#prevMonth').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCalendar()}; $('#nextMonth').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCalendar()}; renderCalendar();
function updateCounter(){const now=new Date(),diff=Math.max(0,now-START),day=86400000;const elapsed=Math.floor(diff/day);const rem=diff-elapsed*day;const h=Math.floor(rem/3600000),min=Math.floor(rem%3600000/60000),s=Math.floor(rem%60000/1000);$('#loveDay').textContent=`第 ${elapsed+1} 天`;$('#cD').textContent=elapsed;$('#cH').textContent=String(h).padStart(2,'0');$('#cM').textContent=String(min).padStart(2,'0');$('#cS').textContent=String(s).padStart(2,'0');} updateCounter();setInterval(updateCounter,1000);

// Qixi: 2026-08-19 local time, automatic once on that date. If page remains open, it also fires at 00:00.
const QIXI_START=new Date(2026,7,19,0,0,0), QIXI_END=new Date(2026,7,20,0,0,0), QIXI_KEY='yizuijingnian-qixi-2026-auto';
function openQixi(){ $('#qixi').classList.add('show'); $('#envelope').classList.remove('open'); }
function checkQixiAuto(){ const n=new Date(); if(n>=QIXI_START&&n<QIXI_END&&!localStorage.getItem(QIXI_KEY)){ localStorage.setItem(QIXI_KEY,'1'); openQixi(); }}
function scheduleQixi(){const n=new Date();if(n<QIXI_START){const wait=QIXI_START-n;setTimeout(()=>{if(!localStorage.getItem(QIXI_KEY)){localStorage.setItem(QIXI_KEY,'1');openQixi();}},Math.min(wait,2147483647)); if(wait>2147483647)setTimeout(scheduleQixi,2147483000);}}
$('#qxClose').onclick=()=>$('#qixi').classList.remove('show'); $('#seal').onclick=()=>$('#envelope').classList.add('open');

function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
